# Extlinux config that U-Boot's sysboot reads out of the boot_b staging FAT.
#
# U-Boot loads kernel, DTB and initramfs from the same FAT, so every path here
# is FAT-root-relative.
#
# The kernel is left UNCOMPRESSED on purpose. booti-ing a raw arm64 Image is
# the path this U-Boot fork is already proven on (the OnePlus 15 port boots
# NixOS through exactly this sysboot/extlinux flow), whereas a gzipped Image
# depends on the compressed-kernel decompression path. CONFIG_SYS_BOOTM_LEN is
# 128 MiB either way, so nothing is gained by compressing - and the FAT still
# fits comfortably in the 96 MiB boot_b partition.

default nx809j
prompt 0
timeout 0

LABEL nx809j
    MENU LABEL Nubia NX809J mainline (kaanapali)
    LINUX /Image
    FDT /nubia-nx809j.dtb
    INITRD /initramfs.cpio.gz
    APPEND console=ttyMSM0,115200n8 console=ttyGS0,115200n8 console=tty1 ignore_loglevel initcall_debug clk_ignore_unused pd_ignore_unused initcall_blacklist=clk_disable_unused,genpd_power_off_unused,regulator_init_complete,of_platform_sync_state_init panic=0 oops=panic fw_devlink=off nmi_watchdog=1 softlockup_panic=1 hardlockup_panic=1 hung_task_panic=1 hung_task_timeout_secs=60 icc-rpmh.qos_disable=1 icc_rpmh.qos_disable=1

# fw_devlink=off: with firmware dependency tracking on, roughly every device on
# this SoC defers (its supplier - a clock controller, a NoC, a regulator - has
# not probed yet), so the actual probes all happen later from the deferred-probe
# workqueue, and the queue order is *not* device-tree order: it is the order in
# which devices happened to give up. That makes the last logged probe useless for
# naming the next one, which is exactly the wall the bring-up hit. Turning devlink
# off makes each device probe from its own driver's initcall instead, so an
# unpaired "calling <driver>_init" in the initcall trace names the hung driver
# directly. Diagnostics only - it reorders probe attempts, it does not fix
# anything, and it is expected to make some probes fail early rather than defer.
#
# dyndbg on the driver core: initcall_debug covers built-in drivers probing from
# their own initcall, but a deferred probe runs from a workqueue and would be
# invisible. dd.c logs "matched device X with driver Y" and "probe of X returned
# ..." for every attempt, so the last pair names the device that never came back
# - which is the whole question once the log points at a bus (the SPMI PMIC
# probe already fails with -EIO) rather than at a single driver.
#
# initcall_debug: the kernel prints "calling <fn>" and "initcall <fn> returned"
# around every initcall, so the last "calling" line with no matching "returned"
# names the function a hang is stuck in. Built-in drivers probe from their own
# initcall, which makes this the cheapest way to find out which one hangs on a
# board whose only log channel is a screen that dies with the reset.
#
# clk_ignore_unused pd_ignore_unused: the kernel disables "unused" clocks and
# power domains at late_initcall. On a platform whose firmware left something on
# that the kernel does not know it needs, that turns into a hang minutes into
# boot - a classic Qualcomm bring-up flag, and cheap to rule in or out.
#

# Notes on the command line:
#
# console= order matters: the LAST entry owns /dev/console, and that is where
# the initramfs drops its shell. tty1 is the fbcon virtual terminal on the
# panel - the simple-framebuffer in /chosen maps the buffer ABL left the DPU
# scanning out - so it goes last. ttyMSM0 and ttyGS0 stay in the list anyway:
# printk fans the log out to every console=, so if a UART or the USB gadget
# ever comes up on this board they get the full log for free.
#
# ignore_loglevel: this board spent its whole bring-up with no console at all,
# so nothing may be lost to the log level.
#
# panic=0 oops=panic: a crash that reboots takes the panel with it - the vendor
# memory-dump screen replaces whatever the kernel had drawn, and the log that
# was on screen for a few seconds is gone. panic=0 keeps the kernel in its panic
# handler instead of rebooting, so the log stays on the panel and can be read
# (or photographed) at leisure; oops=panic makes an oops take the same path
# rather than trying to continue with a broken kernel.
#
# icc-rpmh.qos_disable=1: the static QoS MMIO of the LPASS/MMSS/NSP NoC
# providers lives in power islands that are not up during early boot, and
# programming it raises a synchronous external abort that kills the boot.
# Passed in BOTH spellings deliberately: the parameter belongs to the icc-rpmh
# module, and kbuild rewrites the dash in that file name to an underscore for
# KBUILD_MODNAME, so the underscore form is the one that matches while the dash
# form is the one that reads like the driver's name. Getting that wrong is
# silent - an unmatched parameter is simply ignored - and the failure it guards
# against is a boot-killing abort, so both are passed. NOTE: the image flashed
# for the fw_devlink=off diagnostic run carried only the dash form; that was a
# no-op there (every NoC whose QoS was the problem is disabled in the board DTS)
# and the underscore form comes back with the next build.
