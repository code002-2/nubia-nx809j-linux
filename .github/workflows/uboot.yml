name: Build U-Boot (NX809J)

# Builds the U-Boot port for the Nubia Red Magic 11S Pro+ (NX809J, SM8850
# "kaanapali") on top of infiniti-mainline/u-boot's kaanapali SoC support, and
# packages it as an Android boot image that the stock ABL chainloads.
#
# This is the console bring-up path: U-Boot's video console draws into the
# splash buffer ABL leaves the DPU scanning out (0xfc800000), so it works with
# no display driver and gives the board its first visible console - no UART
# pads, no USB gadget.

on:
  push:
    branches: [main]
    paths:
      - "uboot/**"
      - ".github/workflows/uboot.yml"
  pull_request:
    branches: [main]
    paths:
      - "uboot/**"
      - ".github/workflows/uboot.yml"
  workflow_dispatch:
    inputs:
      uboot_ref:
        description: "infiniti-mainline/u-boot ref (commit/tag/branch) to build against"
        required: false
        default: "8c8a9965729a05b6b0da2f64b8eb3afbe3301a83"

permissions:
  contents: read

env:
  # Built from our own fork: a full-history fork of infiniti-mainline/u-boot
  # with the NX809J board support on top, so the whole chain is self-hosted.
  #   main   = the port (upstream + NX809J board support)
  #   master = pristine upstream, the fork's base (8dbe57ba648)
  UBOOT_REPO: https://github.com/code002-2/uboot
  UBOOT_DEFAULT_REF: 870586b0cd0d655ecc3fe23331b0fb8e31efbb09

jobs:
  uboot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install cross toolchain + U-Boot build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential \
            bc \
            bison \
            ccache \
            flex \
            libgnutls28-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            swig \
            uuid-dev

      - name: Clone U-Boot (kaanapali support)
        run: |
          REF="${{ github.event.inputs.uboot_ref }}"
          [ -n "$REF" ] || REF="$UBOOT_DEFAULT_REF"
          echo "==> $UBOOT_REPO @ $REF"
          git init uboot-src
          cd uboot-src
          git remote add origin "$UBOOT_REPO"
          if ! git fetch --depth 1 origin "$REF"; then
            echo "==> shallow fetch failed, falling back to a full fetch"
            git fetch origin
          fi
          git checkout "$REF" 2>/dev/null || git checkout FETCH_HEAD
          git log --oneline -3

      - name: Verify NX809J board support is present
        run: |
          # The port lives in the fork itself, so this builds exactly what was
          # pushed to code002-2/uboot rather than patching a foreign tree from
          # this repo. Check the three files are there and still say what we
          # think they say - a silently missing board file produces a U-Boot
          # that boots to a black panel, which on this device is
          # indistinguishable from a dead port.
          set -e
          for f in arch/arm/dts/kaanapali-nubia-nx809j.dts \
                   configs/qcom_nx809j_defconfig \
                   configs/qcom_nx809j_dump_defconfig \
                   board/qualcomm/nx809j.env \
                   board/qualcomm/nx809j-dump.env ; do
            [ -s "uboot-src/$f" ] || { echo "!! missing uboot-src/$f"; exit 1; }
            echo "==> $f present ($(stat -c %s "uboot-src/$f") bytes)"
          done
          grep -q 'kaanapali-nubia-nx809j' uboot-src/configs/qcom_nx809j_defconfig
          grep -q 'CONFIG_CMD_SCSI=y'      uboot-src/configs/qcom_nx809j_defconfig
          grep -q 'scsi scan'              uboot-src/board/qualcomm/nx809j.env
          grep -q 'md.b 0xe200000c'        uboot-src/board/qualcomm/nx809j-dump.env
          grep -q 'memory {'               uboot-src/arch/arm/dts/kaanapali-nubia-nx809j.dts
          # bootcmd is ONE line once the backslash continuations are joined, and
          # cli_simple_run_command() refuses any command not strictly shorter
          # than CONFIG_SYS_CBSIZE: it prints "## Command too long!" and runs
          # nothing at all - no partition lookup, no sysboot, no diagnostics. At
          # 2092 bytes against a 2048 limit this file did exactly that on the
          # device, and the only evidence was that one line on the panel.
          limit=$(sed -n 's/^CONFIG_SYS_CBSIZE=//p' uboot-src/configs/qcom_nx809j_defconfig)
          for env in nx809j.env nx809j-dump.env ; do
            python3 scripts/envlen.py "uboot-src/board/qualcomm/$env" "${limit:-2048}"
          done
          git -C uboot-src log --oneline -3

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache-uboot
          key: ccache-uboot-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-uboot-${{ github.ref }}-
            ccache-uboot-

      - name: Build U-Boot
        run: |
          cd uboot-src
          export CCACHE_DIR="$HOME/.cache/ccache-uboot"
          export CCACHE_MAXSIZE=2G
          ccache -s || true
          make qcom_nx809j_defconfig
          # CROSS_COMPILE may legitimately contain spaces - this is U-Boot's
          # own documented ccache idiom (see board/qualcomm/dragonboard820c).
          make -j"$(nproc)" CROSS_COMPILE="ccache aarch64-linux-gnu-"
          echo "--- ccache stats after build ---"
          ccache -s || true
          ls -l u-boot.bin u-boot.dtb u-boot.map u-boot-nodtb.bin
          # Fail loudly if the video console or the storage stack got dropped:
          # without those the image cannot even show a banner on the panel.
          grep -E "^(CONFIG_VIDEO_SIMPLE|CONFIG_VIDEO=|CONFIG_UFS_QCOM|CONFIG_CLK_QCOM_KAANAPALI|CONFIG_QCOM_HYP_SMMU|CONFIG_ARM64|CONFIG_POSITION_INDEPENDENT|CONFIG_OF_LIVE|CONFIG_ENV_USE_DEFAULT_ENV_TEXT_FILE|CONFIG_DEFAULT_DEVICE_TREE|CONFIG_BOOTDELAY|CONFIG_SYS_CBSIZE)=" .config
          # Second, deliberately non-booting image whose only job is to print
          # the crash log pstore left in ramoops. Linux dying takes the whole
          # panel with it (the vendor memory-dump screen overwrites it), so when
          # the kernel crashes there is otherwise nothing left to read - no
          # UART, no USB gadget, and the normal image would just boot Linux
          # again. The objects are shared, so this rebuild is quick.
          cp u-boot.bin u-boot-normal.bin
          make qcom_nx809j_dump_defconfig
          make -j"$(nproc)" CROSS_COMPILE="ccache aarch64-linux-gnu-"
          cp u-boot.bin u-boot-dump.bin
          ls -l u-boot-normal.bin u-boot-dump.bin
          strings u-boot-dump.bin | grep -q 'crash-log dump' || {
            echo "!! the dump image did not pick up nx809j-dump.env"; exit 1; }

      - name: Package boot.img
        run: |
          mkdir -p out
          bash uboot/pack.sh uboot-src/u-boot-normal.bin out/uboot-nx809j-boot.img      out/mkwork
          bash uboot/pack.sh uboot-src/u-boot-dump.bin   out/uboot-nx809j-dump-boot.img out/mkwork
          cp uboot-src/u-boot-normal.bin out/u-boot.bin
          cp uboot-src/u-boot.dtb        out/
          cp uboot-src/u-boot.map        out/
          cp uboot-src/.config           out/uboot-config
          # Keep the exact sources used, so an artifact can always be traced
          # back to the tree that produced it.
          mkdir -p out/src
          cp uboot-src/arch/arm/dts/kaanapali-nubia-nx809j.dts out/src/
          cp uboot-src/board/qualcomm/nx809j.env              out/src/
          cp uboot-src/board/qualcomm/nx809j-dump.env         out/src/
          cp uboot-src/configs/qcom_nx809j_defconfig          out/src/
          cp uboot-src/configs/qcom_nx809j_dump_defconfig     out/src/
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nubia-nx809j-uboot
          path: out/*
          if-no-files-found: error
          retention-days: 30
