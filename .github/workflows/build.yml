name: Build kernel + boot.img

on:
  push:
    branches: [main]
    # Only rebuild for things that actually feed this build. The kernel source
    # lives in its own repo, so every file here is kernel-relevant except the
    # U-Boot packaging bits - and without this filter a one-line U-Boot change
    # kicked off a 20 minute kernel rebuild.
    paths:
      - "config-fragment"
      - "initramfs/**"
      - "scripts/**"
      - "bootb/**"
      - "build.sh"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "config-fragment"
      - "initramfs/**"
      - "scripts/**"
      - "bootb/**"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel repo ref (branch/tag/SHA) to build"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install cross toolchain + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            build-essential \
            bc \
            bison \
            ccache \
            cpio \
            dosfstools \
            flex \
            kmod \
            libelf-dev \
            libssl-dev \
            mtools \
            python3

      - name: Clone kernel source
        uses: actions/checkout@v4
        with:
          repository: code002-2/sm8850-mainline
          ref: ${{ github.event.inputs.kernel_ref || 'main' }}
          path: kernel
          # For the private sm8850-mainline repo, set a PAT secret `PAT_TOKEN`
          # (with `repo` scope). If the repo is public, the default token works.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # A fresh key per commit, but restore-keys fall back to the newest
          # cache of this branch, so DT-only commits reuse every kernel object.
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Build kernel (Image.gz + DTBs)
        run: |
          cd kernel
          # ccache: most of our commits only touch the .dts, which leaves every
          # kernel object unchanged, so a warm cache turns the ~10 min full
          # kernel build into ~1-2 min.
          #
          # CC MUST BE PASSED ON THE MAKE COMMAND LINE. The kernel's Makefile
          # does `CC = $(CROSS_COMPILE)gcc` (line 540, a plain assignment), and
          # a plain makefile assignment silently overrides an *exported* CC -
          # so the old `export CC="ccache aarch64-linux-gnu-gcc"` was ignored
          # and ccache was never on the compile path at all. The tell was
          # `ccache -s` reporting "Hits: 0 / 0, Misses: 0" *after* a full
          # build: not a cold cache, no cache - the compiler was never wrapped,
          # the cache directory stayed empty, and actions/cache therefore had
          # nothing to save. Command-line variables outrank makefile ones, so
          # CC=... on the make line is what actually takes effect.
          export CCACHE_DIR="$HOME/.cache/ccache"
          # 5G never survived: caches are per-repo and compete under a 10 GB
          # budget, and the kernel ccache had grown into the gigabytes, so
          # every new save evicted the previous kernel cache. 2G compressed
          # holds the objects that matter and leaves room for the U-Boot cache.
          export CCACHE_MAXSIZE=2G
          export CCACHE_COMPRESS=true
          ccache -z
          ccache -s || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          # Force-enable every =y option from the fragment. Raw `cat >> .config`
          # is unreliable with duplicates (olddefconfig can keep the base =m),
          # so apply each option explicitly with scripts/config, then resolve.
          while read -r line; do
            case "$line" in
              CONFIG_[A-Z0-9_]*=y)
                sym="${line%%=*}"; sym="${sym#CONFIG_}"
                ./scripts/config --file .config --enable "$sym";;
            esac
          done < ../config-fragment
          # Bring-up: we boot this kernel with the classic FDT protocol
          # (GRUB 2.06 arm64-efi `linux`+`devicetree`). An EFI-stub kernel
          # (CONFIG_EFI_STUB=y, "MZ" PE header at Image offset 0) mixes
          # EFI runtime/service paths into an FDT boot and crashes before
          # console. Force the pure-FDT path so Image offset 0 is the real
          # arm64 head entry; no EFI stub, no EFI runtime.
          ./scripts/config --file .config --disable EFI --disable EFI_STUB
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" olddefconfig
          # dump resolved configs for debugging (display chain especially)
          grep -E "^CONFIG_(DRM|FB|BACKLIGHT|CLK_KAANAPALI|PINCTRL_|SCSI_UFS|USB_DWC3|PHY_QCOM)" .config | sort || true
          # The panel console is the ONLY console on this board: a kernel
          # without it boots with no output anywhere and the test teaches us
          # nothing. FB_SIMPLE is the one that matters, and it silently falls
          # away if DRM_SIMPLEDRM is on (depends on !DRM_SIMPLEDRM), so assert
          # it rather than discover its absence on the device.
          for opt in CONFIG_FB_SIMPLE CONFIG_FRAMEBUFFER_CONSOLE CONFIG_VT_CONSOLE; do
            grep -q "^${opt}=y" .config || { echo "!! ${opt} did not stick"; exit 1; }
            echo "==> ${opt}=y"
          done
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               CC="ccache aarch64-linux-gnu-gcc" \
               -j"$(nproc)" Image.gz dtbs
          echo "--- ccache stats after build ---"
          ccache -s || true
          # Prove ccache was actually on the compile path. Without this, a
          # silently-ignored CC turns every single commit into a 10 minute full
          # rebuild and nothing anywhere says so - which is exactly what
          # happened before this check existed. Counted from the cache
          # directory rather than parsed out of `ccache -s`, whose layout
          # differs between versions.
          files=$(find "$CCACHE_DIR" -type f 2>/dev/null | wc -l)
          size=$(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1)
          echo "==> ccache stored ${files} files, ${size:-0}"
          [ "${files:-0}" -gt 0 ] || {
            echo "!! ccache stored nothing: CC= is not reaching the compiler"; exit 1; }

      - name: Build initramfs
        run: bash initramfs/build-initramfs.sh

      - name: Package boot.img
        run: |
          mkdir -p out
          bash scripts/mkboot.sh \
            kernel/arch/arm64/boot/Image.gz \
            kernel/arch/arm64/boot/dts/qcom/nubia-nx809j.dtb \
            initramfs.cpio.gz \
            out/boot.img
          cp kernel/arch/arm64/boot/dts/qcom/nubia-nx809j.dtb out/
          cp kernel/arch/arm64/boot/Image.gz out/
          # Ship the build metadata needed for crash / dmesg analysis:
          # System.map (symbol VAs), vmlinux, and .config (KASLR, VA bits).
          cp kernel/System.map out/ 2>/dev/null || true
          cp kernel/vmlinux out/ 2>/dev/null || true
          cp kernel/.config out/ 2>/dev/null || true

      - name: Package boot_b staging FAT
        run: |
          # boot_b is the INACTIVE A/B slot: nothing ever boots from it, so it
          # is free scratch space. U-Boot reads the kernel out of it with
          # sysboot (see uboot/board/qualcomm/nx809j.env) instead of needing a
          # write path into UFS, and this is also where the initramfs writes
          # dmesg-mainline.txt back out for us to read from Android.
          #
          # The image itself is built by bootb/mkfat.sh, which explains why the
          # sector size has to be 4096 and verifies the result. It is a script
          # rather than inline commands here because the restage workflow
          # rebuilds the same image in two minutes instead of twenty.
          #
          # Flashed with:  fastboot flash boot_b out/bootb.img
          set -euo pipefail
          mkdir -p out
          bash bootb/mkfat.sh \
            kernel/arch/arm64/boot/Image \
            kernel/arch/arm64/boot/dts/qcom/nubia-nx809j.dtb \
            initramfs.cpio.gz \
            out/bootb.img 80

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nubia-nx809j-bootimg
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Build self-contained GRUB EFI payload
        run: |
          # grub-efi-arm64-bin is an arm64-arch package: not installable via
          # apt on the amd64 runner. Extract the Debian amd64 grub-common
          # (mkimage/mkstandalone) plus the arm64-efi module set into /opt.
          mkdir -p /opt/g && cd /opt/g
          wget -q http://deb.debian.org/debian/pool/main/g/grub2/grub-common_2.06-3~deb11u6_amd64.deb
          wget -q http://deb.debian.org/debian/pool/main/g/grub2/grub-efi-arm64-bin_2.06-3~deb11u6_arm64.deb
          dpkg -x grub-common_2.06-3~deb11u6_amd64.deb .
          dpkg -x grub-efi-arm64-bin_2.06-3~deb11u6_arm64.deb .
          ls usr/lib/grub/
          cd "$GITHUB_WORKSPACE"
          mkdir -p efiroot/boot/grub
          cp kernel/arch/arm64/boot/Image.gz                  efiroot/boot/
          cp kernel/arch/arm64/boot/dts/qcom/nubia-nx809j.dtb efiroot/boot/
          cp initramfs.cpio.gz                                efiroot/boot/
          cat > efiroot/boot/grub/grub.cfg <<'CFG'
          set timeout=0
          menuentry "Nubia NX809J mainline" {
            linux   (memdisk)/boot/Image.gz \
                    console=ttyMSM0,115200n8 console=tty1 console=ttyGS0,115200n8 \
                    icc-rpmh.qos_disable=1 icc_rpmh.qos_disable=1 \
                    ignore_loglevel
            devicetree (memdisk)/boot/nubia-nx809j.dtb
            initrd    (memdisk)/boot/initramfs.cpio.gz
          }
          CFG
          /opt/g/usr/bin/grub-mkstandalone -O arm64-efi \
            --directory=/opt/g/usr/lib/grub/arm64-efi \
            -o out/nx809j_mainline.efi \
            "boot/grub/grub.cfg=$(pwd)/efiroot/boot/grub/grub.cfg" \
            "boot/Image.gz=$(pwd)/efiroot/boot/Image.gz" \
            "boot/nubia-nx809j.dtb=$(pwd)/efiroot/boot/nubia-nx809j.dtb" \
            "boot/initramfs.cpio.gz=$(pwd)/efiroot/boot/initramfs.cpio.gz"
          ls -lh out/

      - name: Upload EFI payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nubia-nx809j-efi-payload
          path: out/nx809j_mainline.efi
          if-no-files-found: error
          retention-days: 30
