name: Build kernel + boot.img

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel repo ref (branch/tag/SHA) to build"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install cross toolchain + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            build-essential \
            bc \
            bison \
            cpio \
            flex \
            kmod \
            libelf-dev \
            libssl-dev \
            python3

      - name: Clone kernel source
        uses: actions/checkout@v4
        with:
          repository: code002-2/sm8850-mainline
          ref: ${{ github.event.inputs.kernel_ref || 'main' }}
          path: kernel
          # For the private sm8850-mainline repo, set a PAT secret `PAT_TOKEN`
          # (with `repo` scope). If the repo is public, the default token works.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build kernel (Image.gz + DTBs)
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          # Force-enable every =y option from the fragment. Raw `cat >> .config`
          # is unreliable with duplicates (olddefconfig can keep the base =m),
          # so apply each option explicitly with scripts/config, then resolve.
          while read -r line; do
            case "$line" in
              CONFIG_[A-Z0-9_]*=y)
                sym="${line%%=*}"; sym="${sym#CONFIG_}"
                ./scripts/config --file .config --enable "$sym";;
            esac
          done < ../config-fragment
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" olddefconfig
          # dump resolved configs for debugging (display chain especially)
          grep -E "^CONFIG_(DRM|BACKLIGHT|CLK_KAANAPALI|PINCTRL_|SCSI_UFS|USB_DWC3|PHY_QCOM)" .config | sort || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image.gz dtbs

      - name: Build initramfs
        run: bash initramfs/build-initramfs.sh

      - name: Package boot.img
        run: |
          mkdir -p out
          bash scripts/mkboot.sh \
            kernel/arch/arm64/boot/Image.gz \
            kernel/arch/arm64/boot/dts/qcom/nubia-nx809j.dtb \
            initramfs.cpio.gz \
            out/boot.img
          cp kernel/arch/arm64/boot/dts/qcom/nubia-nx809j.dtb out/
          cp kernel/arch/arm64/boot/Image.gz out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nubia-nx809j-bootimg
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Build self-contained GRUB EFI payload
        run: |
          # grub-efi-arm64-bin is an arm64-arch package: not installable via
          # apt on the amd64 runner. Extract the Debian amd64 grub-common
          # (mkimage/mkstandalone) plus the arm64-efi module set into /opt.
          mkdir -p /opt/g && cd /opt/g
          wget -q http://deb.debian.org/debian/pool/main/g/grub2/grub-common_2.06-3~deb11u6_amd64.deb
          wget -q http://deb.debian.org/debian/pool/main/g/grub2/grub-efi-arm64-bin_2.06-3~deb11u6_arm64.deb
          dpkg -x grub-common_2.06-3~deb11u6_amd64.deb .
          dpkg -x grub-efi-arm64-bin_2.06-3~deb11u6_arm64.deb .
          ls usr/lib/grub/
          cd "$GITHUB_WORKSPACE"
          mkdir -p efiroot/boot/grub
          cp kernel/arch/arm64/boot/Image.gz                  efiroot/boot/
          cp kernel/arch/arm64/boot/dts/qcom/nubia-nx809j.dtb efiroot/boot/
          cp initramfs.cpio.gz                                efiroot/boot/
          cat > efiroot/boot/grub/grub.cfg <<'CFG'
          set timeout=0
          menuentry "Nubia NX809J mainline" {
            linux   (memdisk)/boot/Image.gz \
                    console=ttyMSM0,115200n8 console=tty1 console=ttyGS0,115200n8 \
                    ignore_loglevel
            devicetree (memdisk)/boot/nubia-nx809j.dtb
            initrd    (memdisk)/boot/initramfs.cpio.gz
          }
          CFG
          /opt/g/usr/bin/grub-mkstandalone -O arm64-efi \
            --directory=/opt/g/usr/lib/grub/arm64-efi \
            -o out/nx809j_mainline.efi \
            "boot/grub/grub.cfg=$(pwd)/efiroot/boot/grub/grub.cfg" \
            "boot/Image.gz=$(pwd)/efiroot/boot/Image.gz" \
            "boot/nubia-nx809j.dtb=$(pwd)/efiroot/boot/nubia-nx809j.dtb" \
            "boot/initramfs.cpio.gz=$(pwd)/efiroot/boot/initramfs.cpio.gz"
          ls -lh out/

      - name: Upload EFI payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nubia-nx809j-efi-payload
          path: out/nx809j_mainline.efi
          if-no-files-found: error
          retention-days: 30
